{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card auth-card">
    <h1>Welcome back</h1>
    <p class="muted">Log in to analyze listings and see your history.</p>
    <form id="login-form" class="stack" novalidate data-next="{{ next }}">
      <div class="form-alert hidden" role="alert" data-form-alert></div>
      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <span class="error" data-error-for="email"></span>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <span class="error" data-error-for="password"></span>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Log in</button>
      <p class="small muted">No account? <a href="{{ url_for('pages.register', next=next) }}">Create one</a></p>
    </form>
  </div>
</div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/auth.js') }}"></script>{% endblock %}
