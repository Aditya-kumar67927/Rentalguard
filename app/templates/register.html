{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card auth-card">
    <h1>Create your account</h1>
    <p class="muted">Your analyses are private to your account.</p>
    <form id="register-form" class="stack" novalidate data-next="{{ next }}">
      <div class="form-alert hidden" role="alert" data-form-alert></div>
      <div class="field">
        <label for="name">Name</label>
        <input id="name" name="name" autocomplete="name" maxlength="80" required>
        <span class="error" data-error-for="name"></span>
      </div>
      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <span class="error" data-error-for="email"></span>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
        <span class="hint">At least 8 characters, mixing letters and numbers.</span>
        <span class="error" data-error-for="password"></span>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Create account</button>
      <p class="small muted">Already registered? <a href="{{ url_for('pages.login', next=next) }}">Log in</a></p>
    </form>
  </div>
</div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/auth.js') }}"></script>{% endblock %}
